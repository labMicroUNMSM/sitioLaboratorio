name: sitio-laboratorio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATABASE_URI: postgresql://laboratorio:${POSTGRES_PASSWORD:-laboratorio_dev}@postgres:5432/laboratorio_db
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      crear-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laboratorio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laboratorio_dev}
      POSTGRES_DB: laboratorio_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U laboratorio -d laboratorio_db']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    build: &build_minio ./docker/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-laboratorio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-laboratorio_dev_key}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  crear-bucket:
    build: *build_minio
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:?Configura S3_BUCKET en .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-laboratorio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-laboratorio_dev_key}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"

volumes:
  postgres_data:
  minio_data:
