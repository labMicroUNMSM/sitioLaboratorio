name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laboratorio
          POSTGRES_PASSWORD: laboratorio_ci
          POSTGRES_DB: laboratorio_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U laboratorio -d laboratorio_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgresql://laboratorio:laboratorio_ci@localhost:5432/laboratorio_db
      PAYLOAD_SECRET: ci-secret-no-usar-en-produccion
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Auditoría de accesibilidad (pa11y-ci)
        run: |
          pnpm exec next start & \
          npx wait-on http://localhost:3000 && \
          pnpm exec pa11y-ci --config .pa11yci.json
