name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/integracion-panel-payload, feat/m1-equipo, feat/m2-lineas]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laboratorio
          POSTGRES_PASSWORD: laboratorio_ci
          POSTGRES_DB: laboratorio_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U laboratorio -d laboratorio_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgresql://laboratorio:laboratorio_ci@localhost:5432/laboratorio_db
      PAYLOAD_SECRET: ci-secret-no-usar-en-produccion
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Permisos de sesión y MFA con PostgreSQL
        env:
          PAYLOAD_RUN_MIGRATIONS: 'true'
        run: |
          export FIELD_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3114 > "$RUNNER_TEMP/panel-mfa.log" 2>&1 &
          panel=$!
          trap 'kill "$panel" 2>/dev/null || true' EXIT
          pnpm exec wait-on --timeout 60000 http://127.0.0.1:3114
          node scripts/comprobar-mfa-ci.mjs

      - name: Auditoría de accesibilidad (pa11y-ci)
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          psql "$DATABASE_URI" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lineas_ci'
          export DATABASE_URI="${DATABASE_URI%/*}/lineas_ci"
          export PAYLOAD_RUN_MIGRATIONS=true
          pnpm exec next start &
          pnpm exec wait-on --timeout 60000 http://localhost:3000
          curl -fsS http://localhost:3000/equipo | grep -F 'Aún no hay integrantes publicados.' > /dev/null
          psql "$DATABASE_URI" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO personas (nombre_completo, slug, rol, activo, eliminado_en) VALUES
            ('Integrante visible CI', 'equipo-visible-ci', 'postdoc', true, NULL),
            ('Ficha inactiva CI', 'equipo-inactiva-ci', 'alumni', false, NULL),
            ('Ficha retirada CI', 'equipo-retirada-ci', 'alumni', true, now());
          SQL
          curl -fsS http://localhost:3000/equipo -o "$RUNNER_TEMP/equipo.html"
          grep -Fq 'Integrante visible CI' "$RUNNER_TEMP/equipo.html"
          if grep -Eq 'Ficha (inactiva|retirada) CI' "$RUNNER_TEMP/equipo.html"; then exit 1; fi
          node scripts/comprobar-lineas-ci.mjs
          psql "$DATABASE_URI" -v ON_ERROR_STOP=1 -c "UPDATE lineas_investigacion SET estado='publicado', eliminado_en=now() WHERE slug='archivo-ci'"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/lineas-investigacion/archivo-ci)" = 404
          pnpm exec pa11y-ci --config .pa11yci.json
